server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/sindri-observatory/current;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ \.(json|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
